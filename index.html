<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suno AI 音樂庫</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    .wave { display: flex; align-items: flex-end; gap: 2px; height: 14px; }
    .wave span { width: 3px; height: 30%; background: #a855f7; border-radius: 2px; animation: wv .9s ease-in-out infinite; }
    .wave span:nth-child(2) { animation-delay: .15s; }
    .wave span:nth-child(3) { animation-delay: .3s; }
    .wave span:nth-child(4) { animation-delay: .45s; }
    .wave.paused span { animation-play-state: paused; }
    @keyframes wv { 0%, 100% { height: 20%; } 50% { height: 100%; } }
    .input { width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: .5rem; padding: .5rem .75rem; color: #fff; font-size: .875rem; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-32">

  <!-- 頂部導航 -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center text-white shadow-lg shadow-purple-500/30">
          <i class="fa-solid fa-compact-disc text-xl animate-spin" style="animation-duration: 8s;"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-wide">Suno AI 音樂畫廊</h1>
          <p class="text-xs text-slate-400">展示由 Suno 生成的所有精選 MP3</p>
        </div>
      </div>
      <div class="flex items-center gap-3 w-full md:w-auto">
        <div class="relative w-full md:w-72">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input type="text" id="searchInput" placeholder="搜尋曲名或分類..."
            class="w-full bg-slate-800/80 border border-slate-700 rounded-full pl-10 pr-4 py-2 text-sm text-white placeholder-slate-400 focus:outline-none focus:border-purple-500 transition">
        </div>
        <button id="adminToggleBtn" class="shrink-0 px-4 py-2 rounded-full text-xs font-medium bg-slate-800 hover:bg-slate-700 border border-slate-700 transition">
          <i class="fa-solid fa-lock"></i> 管理
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8">

    <!-- 管理面板 -->
    <section id="adminPanel" class="hidden mb-8 bg-slate-900 border border-amber-500/40 rounded-2xl p-5">
      <div class="flex items-center justify-between">
        <h2 class="font-bold text-amber-300"><i class="fa-solid fa-unlock"></i> 管理模式</h2>
        <div class="flex items-center gap-4">
          <button id="resetAllBtn" class="text-sm px-4 py-2 rounded-lg bg-amber-900/60 hover:bg-amber-800 text-amber-200">清除全部紀錄</button>
          <button id="lockBtn" class="text-xs text-slate-400 hover:text-white">鎖定</button>
        </div>
      </div>
    </section>

    <!-- 清單切換 -->
    <div id="playlistChips" class="flex items-center gap-2 overflow-x-auto pb-3"></div>

    <!-- 目前開啟的清單 -->
    <div id="plBanner" class="hidden mb-4 flex flex-wrap items-center justify-between gap-3 bg-slate-900 border border-slate-800 rounded-xl px-4 py-3">
      <div>
        <p class="text-xs text-slate-400">播放清單</p>
        <p id="plName" class="font-bold text-lg"></p>
      </div>
      <button id="playAllBtn" class="px-4 py-2 rounded-full bg-purple-600 hover:bg-purple-500 text-sm font-medium">
        <i class="fa-solid fa-play"></i> 播放全部
      </button>
    </div>

    <!-- 篩選與排序 -->
    <div class="flex flex-col md:flex-row md:items-center gap-3 mb-6">
      <div class="flex items-center gap-2 overflow-x-auto pb-2 flex-1" id="genreFilters"></div>
      <select id="sortMode" class="bg-slate-800 border border-slate-700 rounded-full px-4 py-1.5 text-xs text-slate-200 focus:outline-none">
        <option value="manual">排名順序</option>
        <option value="hot">🔥 熱推排行</option>
        <option value="plays">▶ 播放次數</option>
        <option value="likes">👍 最多讚</option>
      </select>
    </div>

    <div id="musicGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
  </main>

  <!-- 歌詞面板（逐行跟隨播放時間） -->
  <div id="lyricsPanel" class="hidden fixed bottom-24 left-0 right-0 z-40 px-4">
    <div class="max-w-2xl mx-auto bg-slate-900/95 border border-purple-500/40 rounded-2xl p-4 shadow-2xl">
      <p id="lyricsTitle" class="text-xs text-slate-400 text-center mb-2"></p>
      <div id="lyricsBox" class="h-48 overflow-y-auto text-center space-y-3 scroll-smooth"></div>
    </div>
  </div>

  <!-- 底部播放器 -->
  <div class="fixed bottom-0 left-0 right-0 bg-slate-900/95 border-t border-slate-800 backdrop-blur-md px-4 py-3 z-50">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3 w-full md:w-1/4">
        <img id="currentCover" src="" alt="" class="w-12 h-12 rounded-lg object-cover bg-slate-800">
        <div class="overflow-hidden flex-1">
          <p id="currentTitle" class="text-sm font-semibold truncate">尚未選擇曲目</p>
          <p id="currentGenre" class="text-xs text-slate-400">點選歌曲即可播放</p>
        </div>
        <div id="waveBar" class="wave shrink-0 paused"><span></span><span></span><span></span><span></span></div>
      </div>
      <div class="flex flex-col items-center gap-2 w-full md:w-2/4">
        <div class="flex items-center gap-6">
          <button id="prevBtn" class="text-slate-400 hover:text-white transition"><i class="fa-solid fa-backward-step"></i></button>
          <button id="playPauseBtn" class="w-10 h-10 rounded-full bg-purple-600 hover:bg-purple-500 text-white flex items-center justify-center transition shadow-lg shadow-purple-600/30">
            <i class="fa-solid fa-play" id="playIcon"></i>
          </button>
          <button id="nextBtn" class="text-slate-400 hover:text-white transition"><i class="fa-solid fa-forward-step"></i></button>
        </div>
        <div class="w-full flex items-center gap-3 text-xs text-slate-400">
          <span id="currentTime">0:00</span>
          <input type="range" id="progressBar" min="0" max="100" value="0" class="w-full h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-purple-500">
          <span id="durationTime">0:00</span>
        </div>
      </div>
      <div class="hidden md:flex items-center justify-end gap-4 w-1/4">
        <button id="lyricsBtn" class="text-xs text-slate-400 hover:text-purple-400 transition" title="顯示歌詞"><i class="fa-solid fa-align-center"></i> 歌詞</button>
        <button id="loopBtn" class="text-xs text-slate-400 hover:text-purple-400 transition" title="循環模式"><i class="fa-solid fa-repeat"></i> <span id="loopLabel">循環：關</span></button>
        <button id="waveToggleBtn" class="text-xs text-purple-400 transition" title="開關波形動畫"><i class="fa-solid fa-wave-square"></i> 波形</button>
        <i class="fa-solid fa-volume-high text-slate-400 text-xs"></i>
        <input type="range" id="volumeBar" min="0" max="1" step="0.05" value="0.8" class="w-20 h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-purple-500">
        <a id="downloadBtn" href="#" download class="text-slate-400 hover:text-purple-400 transition ml-2" title="下載此 MP3"><i class="fa-solid fa-arrow-down-to-line"></i></a>
      </div>
    </div>
  </div>

  <!-- 歌詞視窗 -->
  <div id="lyricsModal" class="fixed inset-0 z-[60] bg-black/70 p-4 items-center justify-center" style="display:none">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full max-h-[80vh] flex flex-col">
      <div class="flex items-center justify-between p-4 border-b border-slate-800">
        <h3 id="lyricsTitle" class="font-bold text-lg"></h3>
        <button id="lyricsClose" class="text-slate-400 hover:text-white text-xl leading-none">&times;</button>
      </div>
      <div id="lyricsBody" class="p-5 overflow-y-auto whitespace-pre-line text-sm leading-7 text-slate-200"></div>
    </div>
  </div>

  <!-- 歌詞視窗 -->
  <div id="lyricsModal" class="hidden fixed inset-0 z-[60] bg-black/70 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full max-h-[80vh] flex flex-col">
      <div class="flex items-center justify-between px-5 py-4 border-b border-slate-800">
        <h3 id="lyricsTitle" class="font-bold"></h3>
        <button onclick="closeLyrics()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="lyricsBody" class="p-5 overflow-y-auto whitespace-pre-wrap leading-loose text-slate-200 text-sm"></div>
    </div>
  </div>

  <audio id="audioPlayer"></audio>

  <script>
    // ===== 設定 =====
    const ADMIN_PASSWORD = "1256Kk34";
    const DEFAULT_COVER = "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500";
    const STORE_KEY = "sg_data_v2";

    // ===== 狀態 =====
    let songs = [];          // { id, title, genre, cover, src }  陣列順序 = 排名
    let genres = [];
    let playlists = [];      // { id, name, ids: [] }
    let stats = {};          // { [songId]: { plays, likes } }
    let nextId = 1, nextPlId = 1;
    let isAdmin = false;
    let currentId = null;
    let queue = [];          // 目前的播放順序（上一首／下一首依此）
    let currentGenreFilter = "all";
    let currentPlaylistFilter = "all";
    let sortMode = "manual";
    let waveOn = true;
    let lyricsOn = false;
    let currentLyrics = [];   // [{ time, text }]
    let activeLyric = -1;
    let loopMode = "off";    // off：不循環　all：全部循環　one：單曲循環

    // ===== DOM =====
    const audio = document.getElementById('audioPlayer');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const progressBar = document.getElementById('progressBar');
    const currentTimeText = document.getElementById('currentTime');
    const durationTimeText = document.getElementById('durationTime');
    const volumeBar = document.getElementById('volumeBar');
    const downloadBtn = document.getElementById('downloadBtn');
    const currentCover = document.getElementById('currentCover');
    const currentTitle = document.getElementById('currentTitle');
    const currentGenre = document.getElementById('currentGenre');
    const waveBar = document.getElementById('waveBar');
    const waveToggleBtn = document.getElementById('waveToggleBtn');
    const musicGrid = document.getElementById('musicGrid');
    const searchInput = document.getElementById('searchInput');
    const genreFilters = document.getElementById('genreFilters');
    const playlistChips = document.getElementById('playlistChips');
    const plBanner = document.getElementById('plBanner');
    const plName = document.getElementById('plName');
    const sortModeSel = document.getElementById('sortMode');
    const adminToggleBtn = document.getElementById('adminToggleBtn');
    const adminPanel = document.getElementById('adminPanel');

    // ===== 儲存（瀏覽器本機） =====
    function load() {
      try {
        const d = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
        if (d) {
          songs = (d.songs || []).filter(s => !s.src.startsWith("blob:"));
          genres = d.genres || [];
          playlists = d.playlists || [];
          stats = d.stats || {};
        }
      } catch (e) { console.warn("讀取失敗", e); }
      songs.forEach(s => { if (!stats[s.id]) stats[s.id] = { plays: 0, likes: 0 }; });
      playlists.forEach(p => p.ids = p.ids.filter(id => songs.some(s => s.id === id)));
      genres = [...new Set([...genres, ...songs.map(s => s.genre)])];
      nextId = songs.reduce((m, s) => Math.max(m, s.id), 0) + 1;
      nextPlId = playlists.reduce((m, p) => Math.max(m, p.id), 0) + 1;
    }

    function save() {
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify({
          songs: songs.filter(s => !s.src.startsWith("blob:")),
          genres, playlists, stats
        }));
      } catch (e) {
        alert("儲存空間不足，請改用較小的圖片或網址");
      }
    }

    // ===== 工具 =====
    function esc(str) {
      return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function formatTime(sec) {
      if (isNaN(sec)) return "0:00";
      const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }
    function st(id) { return stats[id] || (stats[id] = { plays: 0, likes: 0 }); }
    function hotScore(s) { return st(s.id).plays + st(s.id).likes * 3; }

    function readImage(file) {
      return new Promise((resolve, reject) => {
        const fr = new FileReader();
        fr.onload = () => {
          const img = new Image();
          img.onload = () => {
            const r = Math.min(1, 640 / img.width);
            const c = document.createElement('canvas');
            c.width = Math.round(img.width * r);
            c.height = Math.round(img.height * r);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            resolve(c.toDataURL('image/jpeg', 0.8));
          };
          img.onerror = reject;
          img.src = fr.result;
        };
        fr.onerror = reject;
        fr.readAsDataURL(file);
      });
    }

    // 排序後的全部歌曲（排名 #號 以此為準）
    function sortedAll() {
      const arr = [...songs];
      if (sortMode === "hot") arr.sort((a, b) => hotScore(b) - hotScore(a));
      else if (sortMode === "plays") arr.sort((a, b) => st(b.id).plays - st(a.id).plays);
      else if (sortMode === "likes") arr.sort((a, b) => st(b.id).likes - st(a.id).likes);
      return arr;
    }

    // 目前清單（播放清單模式按清單順序，否則按排序）
    function getBaseList() {
      if (currentPlaylistFilter !== "all") {
        const pl = playlists.find(p => p.id === currentPlaylistFilter);
        if (pl) return pl.ids.map(id => songs.find(s => s.id === id)).filter(Boolean);
      }
      return sortedAll();
    }

    function getFilteredSongs() {
      const kw = searchInput.value.toLowerCase().trim();
      return getBaseList().filter(s => {
        const g = currentGenreFilter === "all" || s.genre === currentGenreFilter;
        const k = !kw || [s.title, s.genre].some(v => v.toLowerCase().includes(kw));
        return g && k;
      });
    }

    // ===== 渲染 =====
    function renderGenreFilters() {
      genreFilters.innerHTML = ['all', ...genres].map(g => {
        const active = g === currentGenreFilter;
        return `<button class="genre-btn shrink-0 px-4 py-1.5 rounded-full text-xs font-medium transition ${active ? 'bg-purple-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}" data-genre="${esc(g)}">${g === 'all' ? '全部' : esc(g)}</button>`;
      }).join('');
    }

    function renderPlaylistChips() {
      const items = [{ id: "all", name: "所有歌曲", n: songs.length }, ...playlists.map(p => ({ id: p.id, name: p.name, n: p.ids.length }))];
      playlistChips.innerHTML = items.map(p => {
        const active = String(p.id) === String(currentPlaylistFilter);
        return `<button onclick="openPlaylist('${p.id}')" class="shrink-0 px-3 py-1.5 rounded-lg text-xs font-medium border transition ${active ? 'bg-slate-100 text-slate-900 border-slate-100' : 'bg-slate-900 text-slate-300 border-slate-700 hover:border-slate-500'}">
          <i class="fa-solid fa-list"></i> ${esc(p.name)} <span class="opacity-60">${p.n}</span></button>`;
      }).join('');

      const pl = playlists.find(p => p.id === currentPlaylistFilter);
      plBanner.classList.toggle('hidden', !pl);
      if (pl) plName.textContent = `${pl.name}（${pl.ids.length} 首）`;
    }

    function renderSongs(list) {
      musicGrid.innerHTML = '';
      if (songs.length === 0) {
        musicGrid.innerHTML = `<div class="col-span-full text-center py-16 text-slate-500">尚無歌曲，請按右上角「管理」新增</div>`;
        return;
      }
      if (list.length === 0) {
        musicGrid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">找不到相符的歌曲</div>`;
        return;
      }
      const ranking = sortedAll();
      const playingNow = !audio.paused;

      list.forEach(song => {
        const rank = ranking.findIndex(s => s.id === song.id) + 1;
        const isCurrent = song.id === currentId;
        const isPlayingThis = isCurrent && playingNow;
        const showWave = waveOn && isPlayingThis;
        const stat = st(song.id);

        const adminBar = isAdmin ? `
          <div class="flex gap-1 text-[11px] pt-2">
            <button onclick="resetStats(${song.id})" class="px-2 py-1 rounded bg-slate-800 hover:bg-amber-900 text-amber-300">清除紀錄</button>
          </div>` : '';

        const card = document.createElement('div');
        card.className = "bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden hover:border-purple-500/50 transition group flex flex-col";
        card.innerHTML = `
          <div class="relative overflow-hidden aspect-video bg-slate-800">
            <img src="${esc(song.cover)}" alt="${esc(song.title)}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
            <button onclick="playSongById(${song.id})" class="absolute bottom-3 right-3 w-12 h-12 rounded-full bg-purple-600 hover:bg-purple-500 text-white flex items-center justify-center shadow-lg transition transform translate-y-2 opacity-0 group-hover:translate-y-0 group-hover:opacity-100">
              <i class="fa-solid ${isPlayingThis ? 'fa-pause' : 'fa-play'}"></i>
            </button>
            <span class="absolute top-3 left-3 bg-slate-950/70 backdrop-blur px-2.5 py-1 rounded-md text-[11px] font-semibold text-purple-400 border border-slate-700">${esc(song.genre)}</span>
            <span class="absolute top-3 right-3 bg-slate-950/70 px-2.5 py-1 rounded-md text-[11px] font-bold text-amber-300 border border-slate-700">#${rank}</span>
            ${showWave ? `<div class="wave absolute bottom-3 left-3"><span></span><span></span><span></span><span></span></div>` : ''}
          </div>
          <div class="p-4 flex flex-col flex-grow justify-between gap-3">
            <div>
              <h3 class="font-bold text-base text-white group-hover:text-purple-400 transition">${esc(song.title)}</h3>
              <div class="flex items-center gap-4 mt-3 text-xs text-slate-400">
                <span title="播放次數"><i class="fa-solid fa-headphones"></i> ${stat.plays}</span>
                <span title="熱推分數">🔥 ${hotScore(song)}</span>
                <button onclick="likeSong(${song.id})" class="ml-auto flex items-center gap-1 px-2 py-1 rounded-full bg-slate-800 hover:bg-pink-600/30 hover:text-pink-300 transition">
                  <i class="fa-solid fa-thumbs-up"></i> ${stat.likes}
                </button>
              </div>
              ${adminBar}
            </div>
            <div class="flex items-center justify-between pt-2 border-t border-slate-800/60 text-xs">
              <button onclick="playSongById(${song.id})" class="text-purple-400 hover:underline flex items-center gap-1">
                <i class="fa-solid fa-circle-play"></i> 試聽
              </button>
              <button onclick="showLyrics(${song.id})" class="text-slate-400 hover:text-white flex items-center gap-1 transition">
                <i class="fa-solid fa-align-left"></i> 歌詞
              </button>
              ${song.lyrics ? `<button onclick="showLyrics(${song.id})" class="text-slate-400 hover:text-white flex items-center gap-1 transition"><i class="fa-solid fa-align-left"></i> 歌詞</button>` : ''}
              <a href="${esc(song.src)}" download="${esc(song.title)}.mp3" class="text-slate-400 hover:text-white flex items-center gap-1 transition">
                <i class="fa-solid fa-arrow-down-to-line"></i> 下載 MP3
              </a>
            </div>
          </div>`;
        musicGrid.appendChild(card);
      });
    }

    function refreshAll() {
      renderGenreFilters();
      renderPlaylistChips();
      renderSongs(getFilteredSongs());
    }

    // ===== 播放 =====
    function setPlayingUI(on) {
      playIcon.className = on ? "fa-solid fa-pause" : "fa-solid fa-play";
      waveBar.classList.toggle('paused', !on);
      renderSongs(getFilteredSongs());
    }

    function loadSong(id) {
      const s = songs.find(x => x.id === id);
      if (!s) return;
      currentId = id;
      audio.src = s.src;
      currentCover.src = s.cover;
      currentTitle.innerText = s.title;
      currentGenre.innerText = `${s.genre} • Suno AI`;
      renderLyrics(s);
      downloadBtn.href = s.src;
      downloadBtn.setAttribute('download', `${s.title}.mp3`);
      if (canCount('play_' + id, 60 * 1000)) { st(id).plays++; save(); }
      audio.play();
      setPlayingUI(true);
    }

    window.playSongById = function (id) {
      if (id === currentId) {
        if (audio.paused) { audio.play(); setPlayingUI(true); }
        else { audio.pause(); setPlayingUI(false); }
        return;
      }
      const ids = getFilteredSongs().map(s => s.id);
      queue = ids.includes(id) ? ids : [id];
      loadSong(id);
    };

    // 同一瀏覽器的冷卻時間，防止連續點擊灌水（記錄在 localStorage）
    function canCount(key, ms) {
      let log = {};
      try { log = JSON.parse(localStorage.getItem('sg_cooldown') || '{}'); } catch (e) {}
      const now = Date.now();
      if (log[key] && now - log[key] < ms) return false;
      log[key] = now;
      try { localStorage.setItem('sg_cooldown', JSON.stringify(log)); } catch (e) {}
      return true;
    }

    window.likeSong = function (id) {
      if (!canCount('like_' + id, 24 * 60 * 60 * 1000)) {
        return alert("你已經為這首歌按過讚了（每首每 24 小時一次）");
      }
      st(id).likes++;
      save();
      renderSongs(getFilteredSongs());
    };

    // 管理員：清除單首歌的播放與讚數
    window.resetStats = function (id) {
      const s = songs.find(x => x.id === id);
      if (!s || !confirm(`確定清除「${s.title}」的播放與讚數紀錄？`)) return;
      stats[id] = { plays: 0, likes: 0 };
      save();
      refreshAll();
    };

    // 管理員：清除全部歌曲的紀錄
    function resetAllStats() {
      if (!confirm("確定清除「所有歌曲」的播放與讚數紀錄？此動作無法復原。")) return;
      songs.forEach(s => { stats[s.id] = { plays: 0, likes: 0 }; });
      save();
      refreshAll();
    }

    function playAt(offset) {
      if (!queue.length) queue = getFilteredSongs().map(s => s.id);
      if (!queue.length) return;
      const idx = queue.indexOf(currentId);
      const n = queue.length;
      const next = idx < 0 ? 0 : (idx + offset + n) % n;
      loadSong(queue[next]);
    }

    playPauseBtn.addEventListener('click', () => {
      if (currentId === null) {
        queue = getFilteredSongs().map(s => s.id);
        if (queue.length) loadSong(queue[0]);
        return;
      }
      if (audio.paused) { audio.play(); setPlayingUI(true); }
      else { audio.pause(); setPlayingUI(false); }
    });
    document.getElementById('prevBtn').addEventListener('click', () => playAt(-1));
    document.getElementById('nextBtn').addEventListener('click', () => playAt(1));

    // 音檔載入失敗時提示（例如路徑錯誤或檔案未上傳）
    audio.addEventListener('error', () => {
      const s = songs.find(x => x.id === currentId);
      setPlayingUI(false);
      currentTitle.innerText = s ? s.title + "（無法載入音檔）" : "無法載入音檔";
      currentGenre.innerText = "請檢查 music/songs.json 的 src 路徑與檔案是否已上傳";
    });

    audio.addEventListener('ended', () => {
      if (loopMode === "one") {
        audio.currentTime = 0;
        audio.play();
        return;
      }
      const idx = queue.indexOf(currentId);
      if (loopMode === "all" && queue.length) { playAt(1); return; }
      if (idx >= 0 && idx < queue.length - 1) playAt(1);
      else setPlayingUI(false);
    });

    // ===== 歌詞（逐行跟隨播放時間） =====
    // 歌詞可直接寫在 songs.json（lyrics 陣列），或放在獨立檔案（lyrics_file），需要時才讀取
    const lyricsCache = {};
    let lyricsToken = 0;
    async function getLyrics(song) {
      if (!song) return [];
      if (Array.isArray(song.lyrics)) return song.lyrics;
      if (!song.lyrics_file) return [];
      if (!lyricsCache[song.id]) {
        try {
          const r = await fetch(song.lyrics_file);
          lyricsCache[song.id] = r.ok ? await r.json() : [];
        } catch (e) {
          lyricsCache[song.id] = [];
        }
      }
      return lyricsCache[song.id];
    }

    async function renderLyrics(song) {
      const token = ++lyricsToken;
      const box = document.getElementById('lyricsBox');
      document.getElementById('lyricsTitle').textContent = song ? song.title : '';
      const lines = await getLyrics(song);
      if (token !== lyricsToken) return;   // 已切換到其他歌，略過舊的結果
      currentLyrics = lines;
      activeLyric = -1;
      if (!currentLyrics.length) {
        box.innerHTML = `<p class="text-slate-500 text-sm pt-16">尚無歌詞</p>`;
        return;
      }
      box.innerHTML = currentLyrics.map((l, i) =>
        `<p data-i="${i}" class="lyric-line text-slate-500 transition-colors duration-300">${esc(l.text)}</p>`
      ).join('');
    }

    function updateLyrics() {
      if (!lyricsOn || !currentLyrics.length) return;
      const t = audio.currentTime;
      let idx = -1;
      for (let i = 0; i < currentLyrics.length; i++) {
        if (currentLyrics[i].time <= t) idx = i; else break;
      }
      if (idx === activeLyric) return;
      activeLyric = idx;
      const box = document.getElementById('lyricsBox');
      box.querySelectorAll('.lyric-line').forEach(p => {
        const on = Number(p.dataset.i) === idx;
        p.classList.toggle('text-white', on);
        p.classList.toggle('text-lg', on);
        p.classList.toggle('font-bold', on);
        p.classList.toggle('text-slate-500', !on);
      });
      const cur = box.querySelector(`[data-i="${idx}"]`);
      if (cur) cur.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }

    document.getElementById('lyricsBtn').addEventListener('click', () => {
      lyricsOn = !lyricsOn;
      document.getElementById('lyricsPanel').classList.toggle('hidden', !lyricsOn);
      document.getElementById('lyricsBtn').classList.toggle('text-purple-400', lyricsOn);
      document.getElementById('lyricsBtn').classList.toggle('text-slate-400', !lyricsOn);
      if (lyricsOn) updateLyrics();
    });

    // 切換循環模式：關 → 全部循環 → 單曲循環 → 關
    document.getElementById('loopBtn').addEventListener('click', () => {
      const modes = { off: "循環：關", all: "循環：全部", one: "循環：單曲" };
      loopMode = loopMode === "off" ? "all" : loopMode === "all" ? "one" : "off";
      document.getElementById('loopLabel').textContent = modes[loopMode];
      document.getElementById('loopBtn').classList.toggle('text-purple-400', loopMode !== "off");
      document.getElementById('loopBtn').classList.toggle('text-slate-400', loopMode === "off");
    });

    audio.addEventListener('timeupdate', () => {
      if (!isNaN(audio.duration)) {
        progressBar.value = (audio.currentTime / audio.duration) * 100;
        updateLyrics();
        currentTimeText.innerText = formatTime(audio.currentTime);
        durationTimeText.innerText = formatTime(audio.duration);
      }
    });
    progressBar.addEventListener('input', e => {
      if (!isNaN(audio.duration)) audio.currentTime = (e.target.value / 100) * audio.duration;
    });
    volumeBar.addEventListener('input', e => { audio.volume = e.target.value; });

    waveToggleBtn.addEventListener('click', () => {
      waveOn = !waveOn;
      waveBar.classList.toggle('hidden', !waveOn);
      waveToggleBtn.classList.toggle('text-purple-400', waveOn);
      waveToggleBtn.classList.toggle('text-slate-500', !waveOn);
      renderSongs(getFilteredSongs());
    });

    // ===== 篩選 / 清單 / 排序 =====
    searchInput.addEventListener('input', () => renderSongs(getFilteredSongs()));

    genreFilters.addEventListener('click', e => {
      const btn = e.target.closest('.genre-btn');
      if (!btn) return;
      currentGenreFilter = btn.dataset.genre;
      renderGenreFilters();
      renderSongs(getFilteredSongs());
    });

    window.openPlaylist = function (val) {
      currentPlaylistFilter = val === "all" ? "all" : Number(val);
      currentGenreFilter = "all";
      refreshAll();
    };

    document.getElementById('playAllBtn').addEventListener('click', () => {
      const list = getFilteredSongs();
      if (!list.length) return;
      queue = list.map(s => s.id);
      loadSong(queue[0]);
    });

    sortModeSel.addEventListener('change', e => {
      sortMode = e.target.value;
      renderSongs(getFilteredSongs());
    });

    // ===== 管理（密碼保護） =====
    adminToggleBtn.addEventListener('click', () => {
      if (isAdmin) { adminPanel.classList.toggle('hidden'); return; }
      const pw = prompt("請輸入管理密碼：");
      if (pw === null) return;
      if (pw === ADMIN_PASSWORD) {
        isAdmin = true;
        adminPanel.classList.remove('hidden');
        adminToggleBtn.innerHTML = '<i class="fa-solid fa-unlock"></i> 管理';
        refreshAll();
      } else {
        alert("密碼錯誤");
      }
    });

    document.getElementById('lockBtn').addEventListener('click', () => {
      isAdmin = false;
      adminPanel.classList.add('hidden');
      adminToggleBtn.innerHTML = '<i class="fa-solid fa-lock"></i> 管理';
      refreshAll();
    });

    // 歌詞：讀取 songs.json 裡 lyrics 指定的 txt 檔
    window.showLyrics = async function (id) {
      const s = songs.find(x => x.id === id);
      if (!s || !s.lyrics) return;
      document.getElementById('lyricsTitle').textContent = s.title + " · 歌詞";
      const body = document.getElementById('lyricsBody');
      body.textContent = "載入中...";
      document.getElementById('lyricsModal').classList.remove('hidden');
      try {
        const r = await fetch(s.lyrics);
        if (!r.ok) throw new Error(r.status);
        body.textContent = await r.text();
      } catch (e) {
        body.textContent = "無法載入歌詞（請確認 " + s.lyrics + " 已上傳）";
      }
    };
    window.closeLyrics = function () {
      document.getElementById('lyricsModal').classList.add('hidden');
    };
    document.getElementById('lyricsModal').addEventListener('click', e => {
      if (e.target.id === 'lyricsModal') closeLyrics();
    });

    document.getElementById('resetAllBtn').addEventListener('click', resetAllStats);

    // ===== 歌詞 =====
    const lyricsModal = document.getElementById('lyricsModal');
    window.showLyrics = function (id) {
      const s = songs.find(x => x.id === id);
      if (!s) return;
      document.getElementById('lyricsTitle').textContent = s.title;
      document.getElementById('lyricsBody').textContent = (s.lyrics && s.lyrics.trim()) ? s.lyrics : '（尚未提供歌詞）';
      lyricsModal.style.display = 'flex';
    };
    function closeLyrics() { lyricsModal.style.display = 'none'; }
    document.getElementById('lyricsClose').addEventListener('click', closeLyrics);
    lyricsModal.addEventListener('click', e => { if (e.target === lyricsModal) closeLyrics(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLyrics(); });

    // ===== 啟動：先讀本機資料，再讀 music/songs.json（所有人共用的歌單） =====
    async function loadRemote() {
      try {
        const res = await fetch('music/songs.json');
        const list = await res.json();
        // 以 songs.json 為準：同 id 的舊資料（例如瀏覽器裡殘留的 wav 路徑）會被覆蓋
        list.forEach(s => {
          const i = songs.findIndex(x => x.id === s.id);
          if (i >= 0) songs[i] = { ...songs[i], ...s };
          else songs.push(s);
        });
        // 移除不在 songs.json 裡、但仍殘留在本機的舊歌曲
        const remoteIds = list.map(s => s.id);
        songs = songs.filter(s => remoteIds.includes(s.id));
      } catch (e) { console.warn('無法讀取 songs.json', e); }
    }

    load();
    loadRemote().then(() => {
      songs.forEach(s => { if (!stats[s.id]) stats[s.id] = { plays: 0, likes: 0 }; });
      genres = [...new Set([...genres, ...songs.map(s => s.genre)])];
      nextId = songs.reduce((m, s) => Math.max(m, Number(s.id) || 0), 0) + 1;
      refreshAll();
    });
  </script>
</body>
</html>
