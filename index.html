<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音樂畫廊</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    .wave { display: flex; align-items: flex-end; gap: 2px; height: 14px; }
    .wave span { width: 3px; height: 30%; background: #a855f7; border-radius: 2px; animation: wv .9s ease-in-out infinite; }
    .wave span:nth-child(2) { animation-delay: .15s; }
    .wave span:nth-child(3) { animation-delay: .3s; }
    .wave span:nth-child(4) { animation-delay: .45s; }
    .wave.paused span { animation-play-state: paused; }
    @keyframes wv { 0%, 100% { height: 20%; } 50% { height: 100%; } }
    .input { width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: .5rem; padding: .5rem .75rem; color: #fff; font-size: .875rem; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-32">

  <!-- 頂部導航 -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center text-white shadow-lg shadow-purple-500/30">
          <i class="fa-solid fa-compact-disc text-xl animate-spin" style="animation-duration: 8s;"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-wide">音樂畫廊</h1>
          <p class="text-xs text-slate-400">精選音樂收藏</p>
        </div>
      </div>
      <div class="flex items-center gap-3 w-full md:w-auto">
        <div class="relative w-full md:w-72">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input type="text" id="searchInput" placeholder="搜尋曲名或分類..."
            class="w-full bg-slate-800/80 border border-slate-700 rounded-full pl-10 pr-4 py-2 text-sm text-white placeholder-slate-400 focus:outline-none focus:border-purple-500 transition">
        </div>
        <button id="loginBtn" class="hidden shrink-0 px-4 py-2 rounded-full text-xs font-medium bg-slate-800 hover:bg-slate-700 border border-slate-700 transition">Google 登入</button>
        <button id="adminToggleBtn" class="shrink-0 px-4 py-2 rounded-full text-xs font-medium bg-slate-800 hover:bg-slate-700 border border-slate-700 transition">
          <i class="fa-solid fa-lock"></i> 管理
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8">

    <!-- 管理面板 -->
    <section id="adminPanel" class="hidden mb-8 bg-slate-900 border border-amber-500/40 rounded-2xl p-5">
      <div class="flex items-center justify-between">
        <h2 class="font-bold text-amber-300"><i class="fa-solid fa-unlock"></i> 管理模式</h2>
        <div class="flex items-center gap-4">
          <button id="adminReportBtn" class="text-sm px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200">報表</button>
      <button id="resetAllBtn" class="text-sm px-4 py-2 rounded-lg bg-amber-900/60 hover:bg-amber-800 text-amber-200">清除全部紀錄</button>
          <button id="lockBtn" class="text-xs text-slate-400 hover:text-white">鎖定</button>
        </div>
      </div>
    </section>

    <!-- 最近播放／繼續上次播放 -->
    <div id="recentRow" class="flex items-center gap-2 overflow-x-auto pb-3 text-xs"></div>

    <!-- 新歌提示 -->
    <div id="newSongBanner" class="hidden mb-4 flex items-center justify-between gap-3 bg-purple-900/40 border border-purple-500/40 rounded-xl px-4 py-2 text-sm">
      <span id="newSongText"></span>
      <button id="newSongDismiss" class="shrink-0 text-xs text-slate-300 hover:text-white">知道了</button>
    </div>

    <!-- 我的清單（登入後顯示） -->
    <div id="myListBox" class="hidden mb-4 flex flex-wrap items-center gap-2 text-sm">
      <span class="text-slate-400"><i class="fa-solid fa-folder"></i> 我的清單</span>
      <input id="newUserListName" maxlength="20" placeholder="新清單名稱" class="flex-1 min-w-[140px] bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-white">
      <button id="addUserListBtn" class="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600">建立</button>
      <label class="flex items-center gap-1 text-xs text-slate-400 cursor-pointer">
        <input id="notifyNew" type="checkbox" class="accent-purple-500"> 有新歌通知我
      </label>
      <button id="yearReviewBtn" class="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600">📊 年度回顧</button>
      <button id="delUserListBtn" class="hidden px-3 py-1.5 rounded-lg bg-red-900/60 hover:bg-red-800 text-red-200">刪除此清單</button>
    </div>

    <!-- 清單切換 -->
    <div id="playlistChips" class="flex items-center gap-2 overflow-x-auto pb-3"></div>

    <!-- 目前開啟的清單 -->
    <div id="plBanner" class="hidden mb-4 flex flex-wrap items-center justify-between gap-3 bg-slate-900 border border-slate-800 rounded-xl px-4 py-3">
      <div>
        <p class="text-xs text-slate-400">播放清單</p>
        <p id="plName" class="font-bold text-lg"></p>
      </div>
      <button id="playAllBtn" class="px-4 py-2 rounded-full bg-purple-600 hover:bg-purple-500 text-sm font-medium">
        <i class="fa-solid fa-play"></i> 播放全部
      </button>
    </div>

    <!-- 本週熱門 -->
    <div id="hotBox" class="flex flex-wrap items-center gap-2 mb-6"></div>

    <!-- 篩選與排序 -->
    <div class="flex flex-col md:flex-row md:items-center gap-3 mb-6">
      <div class="flex items-center gap-2 overflow-x-auto pb-2 flex-1" id="genreFilters"></div>
      <button id="randomBtn" class="shrink-0 px-4 py-1.5 rounded-full bg-slate-800 border border-slate-700 text-xs text-slate-200 hover:bg-slate-700">🎲 隨機一首</button>
      <select id="sortMode" class="bg-slate-800 border border-slate-700 rounded-full px-4 py-1.5 text-xs text-slate-200 focus:outline-none">
        <option value="manual">排名順序</option>
        <option value="name">🔤 曲名 A→Z</option>
        <option value="hot">🔥 熱推排行</option>
        <option value="plays">▶ 播放次數</option>
        <option value="likes">👍 最多讚</option>
      </select>
    </div>

    <div id="vaultBox" class="mb-6 bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 flex flex-wrap items-center gap-3">
      <span class="text-sm text-slate-300"><i class="fa-solid fa-lock"></i> 特別版</span>
      <input id="vaultCode" type="password" placeholder="輸入解鎖碼" autocomplete="off"
        class="flex-1 min-w-[180px] bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:border-purple-500">
      <button id="vaultBtn" class="px-4 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-sm">解鎖</button>
      <label class="flex items-center gap-1 text-xs text-slate-400 cursor-pointer">
        <input id="vaultRemember" type="checkbox" class="accent-purple-500"> 記住在這台電腦
      </label>
      <span id="vaultMsg" class="text-xs text-slate-400"></span>
    </div>

    <div id="musicGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
  </main>

  <!-- 歌詞面板（逐行跟隨播放時間） -->
  <div id="lyricsPanel" class="hidden fixed bottom-24 left-0 right-0 z-40 px-4">
    <div class="max-w-2xl mx-auto bg-slate-900/95 border border-purple-500/40 rounded-2xl p-4 shadow-2xl">
      <p id="lyricsTitle" class="text-xs text-slate-400 text-center mb-2"></p>
      <div id="lyricsBox" class="h-48 overflow-y-auto text-center space-y-3 scroll-smooth"></div>
    </div>
  </div>

  <!-- 通用面板（年度回顧／管理員報表） -->
  <div id="reviewPanel" class="hidden fixed inset-x-0 bottom-24 z-40 px-4">
    <div class="max-w-xl mx-auto bg-slate-900/95 border border-slate-700 rounded-2xl p-4 shadow-2xl">
      <div class="flex items-center justify-between mb-2">
        <p id="reviewTitle" class="font-bold"></p>
        <button id="reviewClose" class="text-xs text-slate-400 hover:text-white">關閉</button>
      </div>
      <div id="reviewBody" class="max-h-72 overflow-y-auto text-sm"></div>
    </div>
  </div>

  <!-- 留言面板 -->
  <div id="commentPanel" class="hidden fixed inset-x-0 bottom-24 z-40 px-4">
    <div class="max-w-xl mx-auto bg-slate-900/95 border border-slate-700 rounded-2xl p-4 shadow-2xl">
      <div class="flex items-center justify-between mb-2">
        <p id="commentTitle" class="font-bold"></p>
        <button id="commentClose" class="text-xs text-slate-400 hover:text-white">關閉</button>
      </div>
      <div id="commentList" class="h-48 overflow-y-auto space-y-2 text-sm"></div>
      <div class="flex gap-2 mt-2">
        <input id="commentInput" maxlength="300" placeholder="寫下你的留言（需登入）" class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-white">
        <button id="commentSend" class="px-4 rounded-lg bg-purple-600 hover:bg-purple-500 text-sm">送出</button>
      </div>
    </div>
  </div>

  <!-- 底部播放器 -->
  <div class="fixed bottom-0 left-0 right-0 bg-slate-900/95 border-t border-slate-800 backdrop-blur-md px-4 py-3 z-50">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3 w-full md:w-1/4">
        <img id="currentCover" src="" alt="" class="w-12 h-12 rounded-lg object-cover bg-slate-800">
        <div class="overflow-hidden flex-1">
          <p id="currentTitle" class="text-sm font-semibold truncate">尚未選擇曲目</p>
          <p id="currentGenre" class="text-xs text-slate-400">點選歌曲即可播放</p>
        </div>
        <div id="waveBar" class="wave shrink-0 paused"><span></span><span></span><span></span><span></span></div>
      </div>
      <div class="flex flex-col items-center gap-2 w-full md:w-2/4">
        <div class="flex items-center gap-6">
          <button id="prevBtn" class="text-slate-400 hover:text-white transition"><i class="fa-solid fa-backward-step"></i></button>
          <button id="playPauseBtn" class="w-10 h-10 rounded-full bg-purple-600 hover:bg-purple-500 text-white flex items-center justify-center transition shadow-lg shadow-purple-600/30">
            <i class="fa-solid fa-play" id="playIcon"></i>
          </button>
          <button id="nextBtn" class="text-slate-400 hover:text-white transition"><i class="fa-solid fa-forward-step"></i></button>
        </div>
        <div class="w-full flex items-center gap-3 text-xs text-slate-400">
          <span id="currentTime">0:00</span>
          <input type="range" id="progressBar" min="0" max="100" value="0" class="w-full h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-purple-500">
          <span id="durationTime">0:00</span>
        </div>
      </div>
      <div class="flex items-center gap-3 md:gap-4 w-full md:w-1/4 md:justify-end text-xs overflow-x-auto whitespace-nowrap py-1">
        <select id="speedSel" title="播放速度" class="bg-slate-800 border border-slate-700 rounded px-1 py-0.5 text-xs text-slate-200">
          <option value="0.75">0.75x</option><option value="1" selected>1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2x</option>
        </select>
        <select id="sleepSel" title="睡眠定時" class="bg-slate-800 border border-slate-700 rounded px-1 py-0.5 text-xs text-slate-200">
          <option value="off">定時：關</option><option value="15">15 分鐘</option><option value="30">30 分鐘</option><option value="60">60 分鐘</option><option value="end">播完此首</option>
        </select>
        <button id="lyricsBtn" class="text-xs text-slate-400 hover:text-purple-400 transition" title="顯示歌詞"><i class="fa-solid fa-align-center"></i> 歌詞</button>
        <button id="loopBtn" class="text-xs text-slate-400 hover:text-purple-400 transition" title="循環模式"><i class="fa-solid fa-repeat"></i> <span id="loopLabel">循環：關</span></button>
        <button id="waveToggleBtn" class="text-xs text-purple-400 transition" title="開關波形動畫"><i class="fa-solid fa-wave-square"></i> 波形</button>
        <button id="muteBtn" class="text-slate-400 hover:text-white text-xs" title="靜音（按 M）"><i class="fa-solid fa-volume-high"></i></button>
        <input type="range" id="volumeBar" min="0" max="1" step="0.05" value="0.8" class="w-20 h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-purple-500">
        <a id="downloadBtn" href="#" download class="text-slate-400 hover:text-purple-400 transition ml-2" title="下載此 MP3"><i class="fa-solid fa-arrow-down-to-line"></i></a>
      </div>
    </div>
  </div>

  <audio id="audioPlayer"></audio>

  <script>
    // ===== 設定 =====
    // 管理員解鎖碼以 music/auth.json 的雜湊值驗證，程式中不保存解鎖碼
    const DEFAULT_COVER = "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500";
    const STORE_KEY = "sg_data_v2";

    // ===== 狀態 =====
    let songs = [];          // { id, title, genre, cover, src }  陣列順序 = 排名
    let genres = [];
    let playlists = [];      // { id, name, ids: [] }
    let stats = {};          // { [songId]: { plays, likes } }
    let nextId = 1, nextPlId = 1;
    let isAdmin = false;
    let currentId = null;
    let queue = [];          // 目前的播放順序（上一首／下一首依此）
    let currentGenreFilter = "all";
    let currentPlaylistFilter = "all";
    let sortMode = "manual";
    let waveOn = true;
    let lyricsOn = false;
    let currentLyrics = [];   // [{ time, text }]
    let activeLyric = -1;
    // 循環模式：關（播完停止）／全部循環／單曲循環
    const LOOP_MODES = ["off", "all", "one"];
    const LOOP_LABELS = { off: "循環：關", all: "循環：全部", one: "循環：單曲" };
    let loopMode = "off";
    let playHistory = [];   // 播放過的歌曲（最近播放用）

    // ===== DOM =====
    const audio = document.getElementById('audioPlayer');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const progressBar = document.getElementById('progressBar');
    const currentTimeText = document.getElementById('currentTime');
    const durationTimeText = document.getElementById('durationTime');
    const volumeBar = document.getElementById('volumeBar');
    const downloadBtn = document.getElementById('downloadBtn');
    const currentCover = document.getElementById('currentCover');
    const currentTitle = document.getElementById('currentTitle');
    const currentGenre = document.getElementById('currentGenre');
    const waveBar = document.getElementById('waveBar');
    const waveToggleBtn = document.getElementById('waveToggleBtn');
    const musicGrid = document.getElementById('musicGrid');
    const searchInput = document.getElementById('searchInput');
    const genreFilters = document.getElementById('genreFilters');
    const playlistChips = document.getElementById('playlistChips');
    const plBanner = document.getElementById('plBanner');
    const plName = document.getElementById('plName');
    const sortModeSel = document.getElementById('sortMode');
    const adminToggleBtn = document.getElementById('adminToggleBtn');
    const adminPanel = document.getElementById('adminPanel');

    // ===== 儲存（瀏覽器本機） =====
    function load() {
      try {
        const d = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
        if (d) {
          songs = (d.songs || []).filter(s => !s.src.startsWith("blob:"));
          genres = d.genres || [];
          playlists = d.playlists || [];
          stats = {};   // 次數以共用資料庫為準，不使用本機快取
        }
      } catch (e) { console.warn("讀取失敗", e); }
      songs.forEach(s => { if (!stats[s.id]) stats[s.id] = { plays: 0, likes: 0 }; });
      playlists.forEach(p => p.ids = p.ids.filter(id => songs.some(s => s.id === id)));
      genres = [...new Set(songs.map(s => s.genre))];   // 只顯示目前可見歌曲的分類
      nextId = songs.reduce((m, s) => Math.max(m, s.id), 0) + 1;
      nextPlId = playlists.reduce((m, p) => Math.max(m, p.id), 0) + 1;
    }

    function save() {
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify({
          songs: songs.filter(s => !s.src.startsWith("blob:")),
          genres, playlists, stats
        }));
      } catch (e) {
        alert("儲存空間不足，請改用較小的圖片或網址");
      }
    }

    // ===== 工具 =====
    function esc(str) {
      return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function formatTime(sec) {
      if (isNaN(sec)) return "0:00";
      const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }
    function st(id) { return stats[id] || (stats[id] = { plays: 0, likes: 0 }); }
    function hotScore(s) { return st(s.id).plays + st(s.id).likes * 3; }

    function readImage(file) {
      return new Promise((resolve, reject) => {
        const fr = new FileReader();
        fr.onload = () => {
          const img = new Image();
          img.onload = () => {
            const r = Math.min(1, 640 / img.width);
            const c = document.createElement('canvas');
            c.width = Math.round(img.width * r);
            c.height = Math.round(img.height * r);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            resolve(c.toDataURL('image/jpeg', 0.8));
          };
          img.onerror = reject;
          img.src = fr.result;
        };
        fr.onerror = reject;
        fr.readAsDataURL(file);
      });
    }

    // 排序後的全部歌曲（排名 #號 以此為準）
    function sortedAll() {
      const arr = [...songs];
      if (sortMode === "hot") arr.sort((a, b) => hotScore(b) - hotScore(a));
      else if (sortMode === "plays") arr.sort((a, b) => st(b.id).plays - st(a.id).plays);
      else if (sortMode === "likes") arr.sort((a, b) => st(b.id).likes - st(a.id).likes);
      else if (sortMode === "name") arr.sort((a, b) => a.title.localeCompare(b.title, 'zh-Hant'));
      return arr;
    }

    // 目前清單（播放清單模式按清單順序，否則按排序）
    function getBaseList() {
      if (typeof currentPlaylistFilter === "string" && currentPlaylistFilter.startsWith("u:")) {
        const key = currentPlaylistFilter.slice(2);
        const ids = Object.keys((userLists[key] && userLists[key].ids) || {}).map(Number);
        return ids.map(id => songs.find(s => s.id === id)).filter(Boolean);
      }
      if (currentPlaylistFilter !== "all") {
        const pl = playlists.find(p => p.id === currentPlaylistFilter);
        if (pl) return pl.ids.map(id => songs.find(s => s.id === id)).filter(Boolean);
      }
      return sortedAll();
    }

    function getFilteredSongs() {
      const kw = searchInput.value.toLowerCase().trim();
      let base = getBaseList();
      if (currentGenreFilter === "__fav") base = base.filter(s => userFavs.has(s.id));
      else if (currentGenreFilter === "__hist") base = songs.filter(s => userHist[s.id]).sort((a, b) => userHist[b.id] - userHist[a.id]);
      return base.filter(s => {
        const g = currentGenreFilter === "all" || currentGenreFilter.startsWith("__") || s.genre === currentGenreFilter;
        const k = !kw || [s.title, s.genre].some(v => v.toLowerCase().includes(kw));
        return g && k;
      });
    }

    // ===== 渲染 =====
    function renderGenreFilters() {
      const cats = ['all', ...genres].map(g => [g, g === 'all' ? '全部' : esc(g)]);
      const specials = currentUser ? [["__fav", "❤ 我的收藏"], ["__hist", "🕘 最近播放"]] : [];
      genreFilters.innerHTML = [...cats, ...specials].map(([g, label]) => {
        const active = g === currentGenreFilter;
        return `<button class="genre-btn shrink-0 px-4 py-1.5 rounded-full text-xs font-medium transition ${active ? 'bg-purple-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}" data-genre="${esc(g)}">${label}</button>`;
      }).join('');
    }

    function renderPlaylistChips() {
      const userItems = currentUser ? Object.entries(userLists).map(([k, v]) => ({ id: "u:" + k, name: "📁 " + (v.name || "未命名"), n: Object.keys(v.ids || {}).length })) : [];
      const items = [{ id: "all", name: "所有歌曲", n: songs.length }, ...userItems];
      playlistChips.innerHTML = items.map(p => {
        const active = String(p.id) === String(currentPlaylistFilter);

    // ===== 特別版：輸入密碼解密後才能播放 =====
    const unlockedUrls = {};   // 已解鎖歌曲的暫存播放網址（重新整理後需再輸入）
    async function unlockSong(s) {
      const pw = prompt(`「${s.title}」為特別版，請輸入密碼：`);
      if (pw === null) return false;
      try {
        const bytes = new Uint8Array(await (await fetch(s.src)).arrayBuffer());
        const magic = String.fromCharCode(...bytes.slice(0, 4));
        if (magic !== 'SGE1') throw new Error('檔案格式錯誤');
        const salt = bytes.slice(4, 20), iv = bytes.slice(20, 32), data = bytes.slice(32);
        const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
        const key = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
        const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
        unlockedUrls[s.id] = URL.createObjectURL(new Blob([plain], { type: 'audio/mpeg' }));
        return true;
      } catch (e) {
        alert('密碼錯誤，或檔案無法讀取');
        return false;
      }
    }

    async function loadSongNow(id, startAt = 0) {
      const s = songs.find(x => x.id === id);
      if (!s) return;
      if (s.locked && !unlockedUrls[id]) {
        const ok = await unlockSong(s);
        if (!ok) return;
      }
      currentId = id;
      playHistory.push(id);
      if (currentUser && sharedDb) sharedDb.ref('userHistory/' + currentUser.uid + '/' + id).set(Date.now());
      renderRecentRow();
      if (playHistory.length > 200) playHistory.shift();
      audio.src = s.locked ? unlockedUrls[id] : s.src;
      audio.playbackRate = Number(document.getElementById('speedSel').value);
      if (startAt > 0) {
        audio.addEventListener('loadedmetadata', function seekOnce() {
          audio.currentTime = startAt;
          audio.removeEventListener('loadedmetadata', seekOnce);
        });
      }
      currentCover.src = s.cover;
      currentTitle.innerText = s.title;
      currentGenre.innerText = `${s.genre}`;
      renderLyrics(s);
      if (s.locked) {
        downloadBtn.removeAttribute('href');
      } else {
        downloadBtn.href = s.src;
        downloadBtn.setAttribute('download', `${s.title}.mp3`);
      }
      if (canCount('play_' + id, 60 * 1000)) {
        st(id).plays++; save(); remoteInc(id, 'plays');
        if (currentUser && sharedDb) sharedDb.ref('userPlays/' + currentUser.uid + '/' + new Date().getFullYear() + '/' + id).transaction(n => (n || 0) + 1);
      }
      audio.play();
      setPlayingUI(true);
    }

    window.playSongById = function (id) {
      if (id === currentId) {
        if (audio.paused) { audio.play(); setPlayingUI(true); }
        else { audio.pause(); setPlayingUI(false); }
        return;
      }
      const ids = getFilteredSongs().map(s => s.id);
      queue = ids.includes(id) ? ids : [id];
      loadSong(id);
    };

    // 同一瀏覽器的冷卻時間，防止連續點擊灌水（記錄在 localStorage）
    function canCount(key, ms) {
      let log = {};
      try { log = JSON.parse(localStorage.getItem('sg_cooldown') || '{}'); } catch (e) {}
      const now = Date.now();
      if (log[key] && now - log[key] < ms) return false;
      log[key] = now;
      try { localStorage.setItem('sg_cooldown', JSON.stringify(log)); } catch (e) {}
      return true;
    }

    window.likeSong = async function (id) {
      if (!currentUser || !sharedDb) return alert('請先按右上角「Google 登入」才能按讚');
      const ref = sharedDb.ref('userLikes/' + currentUser.uid + '/' + id);
      const snap = await ref.once('value');
      if (snap.val()) return alert('你已經為這首歌按過讚了');
      await ref.set(true);
      remoteInc(id, 'likes');
      bumpActivity();
    };

    // 管理員：清除單首歌的播放與讚數
    window.resetStats = function (id) {

      if (!s || !confirm(`確定清除「${s.title}」的播放與讚數紀錄？`)) return;

    function resetAllStats() {

    function playAt(offset) {
      queue = buildQueue();
      if (!queue.length) return;
      const idx = queue.indexOf(currentId);
      const n = queue.length;
      const next = idx < 0 ? 0 : (idx + offset + n) % n;
      loadSong(queue[next]);
    }

    playPauseBtn.addEventListener('click', () => {
      if (currentId === null) {
        queue = getFilteredSongs().map(s => s.id);

      else { audio.pause(); setPlayingUI(false); }

    // 音檔載入失敗時提示（例如路徑錯誤或檔案未上傳）
    audio.addEventListener('error', () => {

      if (sleepAfterSong) {

        setPlayingUI(false);
        return;
      }
      if (loopMode === "one") {
        audio.currentTime = 0;
        audio.play();
        return;
      }
      queue = buildQueue();
      const idx = queue.indexOf(currentId);
      if (loopMode === "all" && queue.length) { playAt(1); return; }
      if (idx >= 0 && idx < queue.length - 1) playAt(1);
      else setPlayingUI(false);
    });

    // 播放順序：有開清單就在清單內，有選分類就只在該分類內，否則全部
    function buildQueue() {
      return getFilteredSongs().map(s => s.id);

    // ===== 歌詞（逐行跟隨播放時間） =====
    // 歌詞可直接寫在 songs.json（lyrics 陣列），或放在獨立檔案（lyrics_file），需要時才讀取
    const lyricsCache = {};
    let lyricsToken = 0;
    async function getLyrics(song) {
      if (!song) return [];
      if (Array.isArray(song.lyrics)) return song.lyrics;
      if (!song.lyrics_file) return [];
      if (!lyricsCache[song.id]) {
        try {
          const r = await fetch(song.lyrics_file);
          lyricsCache[song.id] = r.ok ? await r.json() : [];
        } catch (e) {
          lyricsCache[song.id] = [];
        }
      }
      return lyricsCache[song.id];
    }

    async function renderLyrics(song) {
      const token = ++lyricsToken;
      const box = document.getElementById('lyricsBox');
      document.getElementById('lyricsTitle').textContent = song ? song.title : '';
      const lines = await getLyrics(song);
      if (token !== lyricsToken) return;   // 已切換到其他歌，略過舊的結果
      currentLyrics = lines;
      activeLyric = -1;
      if (!currentLyrics.length) {
        box.innerHTML = `<p class="text-slate-500 text-sm pt-16">尚無歌詞</p>`;
        return;
      }
      box.innerHTML = currentLyrics.map((l, i) =>
        `<p data-i="${i}" class="lyric-line text-slate-500 transition-colors duration-300">${esc(l.text)}</p>`
      ).join('');
    }

    function updateLyrics() {
      if (!lyricsOn || !currentLyrics.length) return;
      const t = audio.currentTime;
      let idx = -1;
      for (let i = 0; i < currentLyrics.length; i++) {
        if (currentLyrics[i].time <= t) idx = i; else break;
      }
      if (idx === activeLyric) return;
      activeLyric = idx;
      const box = document.getElementById('lyricsBox');
      box.querySelectorAll('.lyric-line').forEach(p => {
        const on = Number(p.dataset.i) === idx;
        p.classList.toggle('text-white', on);
        p.classList.toggle('text-lg', on);
        p.classList.toggle('font-bold', on);
        p.classList.toggle('text-slate-500', !on);
      });
      const cur = box.querySelector(`[data-i="${idx}"]`);
      if (cur) cur.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }

    document.getElementById('lyricsBtn').addEventListener('click', () => {

      document.getElementById('lyricsBtn').classList.toggle('text-purple-400', lyricsOn);

    // ===== 管理（密碼保護） =====
    // 驗證管理員解鎖碼：與 music/auth.json 的 PBKDF2 雜湊比對
    async function verifyAdminCode(code) {
      try {
        const a = await (await fetch('music/auth.json', { cache: 'no-store' })).json();
        const salt = Uint8Array.from(atob(a.salt), c => c.charCodeAt(0));
        const base = await crypto.subtle.importKey('raw', vaultEnc.encode(code), 'PBKDF2', false, ['deriveBits']);
        const bits = await crypto.subtle.deriveBits(
          { name: 'PBKDF2', salt, iterations: a.iterations, hash: 'SHA-256' }, base, 256);
        const hex = [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, '0')).join('');
        return hex === a.hash;
      } catch (e) {
        console.error('管理員驗證失敗：', e);
        return false;
      }
    }

    adminToggleBtn.addEventListener('click', async () => {

        refreshAll();
        return;

      const pw = prompt("請輸入管理員解鎖碼：");
      if (pw === null) return;
      if (await verifyAdminCode(pw)) {
        isAdmin = true;
        adminPanel.classList.remove('hidden');
        adminToggleBtn.innerHTML = '<i class="fa-solid fa-unlock"></i> 管理';

    document.getElementById('speedSel').addEventListener('change', e => {

        ? '<i class="fa-solid fa-volume-xmark"></i>'
        : '<i class="fa-solid fa-volume-high"></i>';

    let sleepAfterSong = false;
    let sleepTimerId = null;
    document.getElementById('sleepSel').addEventListener('change', e => {
      const v = e.target.value;
      clearTimeout(sleepTimerId);
      sleepTimerId = null;
      sleepAfterSong = false;
      if (v === 'end') {
        sleepAfterSong = true;
      } else if (v !== 'off') {
        sleepTimerId = setTimeout(() => {
          audio.pause();
          setPlayingUI(false);
          e.target.value = 'off';
          sleepTimerId = null;
        }, Number(v) * 60 * 1000);
      }
    });

    // 快捷鍵：空白鍵播放／暫停，←→ 上一首／下一首，↑↓ 音量，M 靜音
    document.addEventListener('keydown', e => {
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
      if (e.code === 'Space') { e.preventDefault(); playPauseBtn.click(); }
      else if (e.code === 'ArrowRight') playNext();
      else if (e.code === 'ArrowLeft') playPrev();
      else if (e.code === 'ArrowUp' || e.code === 'ArrowDown') {
        e.preventDefault();
        const d = e.code === 'ArrowUp' ? 0.05 : -0.05;
        volumeBar.value = Math.max(0, Math.min(1, Number(volumeBar.value) + d)).toFixed(2);
        audio.volume = Number(volumeBar.value);
      }
      else if (e.key === 'm' || e.key === 'M') document.getElementById('muteBtn').click();
    });

    // ===== 最近播放與繼續上次播放 =====
    function renderRecentRow() {
      const row = document.getElementById('recentRow');
      const recent = [];
      for (let i = playHistory.length - 1; i >= 0 && recent.length < 8; i--) {
        const id = playHistory[i];
        if (!recent.includes(id) && songs.some(s => s.id === id)) recent.push(id);
      }
      let html = '';
      let last = null;
      try { last = JSON.parse(localStorage.getItem('sg_last') || 'null'); } catch (e) {}

    const vaultEnc = new TextEncoder();

    async function deriveVaultKey(code, salt) {
      const base = await crypto.subtle.importKey('raw', vaultEnc.encode(code), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: 600000, hash: 'SHA-256' },
        base,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
    }

    // 讀取 .enc 檔，解密成可播放的暫存網址（只存在這次開啟的頁面中）
    async function decryptVaultFile(code, url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error('找不到檔案');
      const buf = new Uint8Array(await res.arrayBuffer());
      if (buf.length < 29) throw new Error('檔案格式錯誤或檔案不完整');
      const salt = buf.slice(0, 16), iv = buf.slice(16, 28), data = buf.slice(28);
      const key = await deriveVaultKey(code, salt);
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
      return URL.createObjectURL(new Blob([plain], { type: 'audio/mpeg' }));
    }

    async function unlockVault(codeArg) {
      const isAuto = typeof codeArg === 'string';
      const code = isAuto ? codeArg : document.getElementById('vaultCode').value;
      const msg = document.getElementById('vaultMsg');
      if (!code) { msg.textContent = '請輸入解鎖碼'; return; }
      if (!lockedMeta.length) { msg.textContent = '目前沒有特別版歌曲（請確認 songs.json 已更新）'; return; }
      msg.textContent = '解鎖中…';
      try {
        const unlocked = [];
        for (const m of lockedMeta) {
          const src = await decryptVaultFile(code, m.src_enc);
          unlocked.push({ id: m.id, title: m.title, genre: m.genre, prompt: '', cover: m.cover || DEFAULT_COVER, src });
        }
        unlocked.forEach(u => {
          if (!songs.some(x => x.id === u.id)) songs.push(u);
          if (!stats[u.id]) stats[u.id] = { plays: 0, likes: 0 };
          if (!genres.includes(u.genre)) genres.push(u.genre);
        });
        lockedMeta = [];
        document.getElementById('vaultCode').value = '';
        const remember = document.getElementById('vaultRemember').checked;
        try {
          if (remember) localStorage.setItem('sg_vault', code);
          else localStorage.removeItem('sg_vault');
        } catch (err) {}
        msg.textContent = remember ? '已解鎖（此電腦會記住）' : '已解鎖';
        refreshAll();
      } catch (e) {
        console.error('特別版解鎖失敗：', e);
        if (isAuto && e.name === 'OperationError') { try { localStorage.removeItem('sg_vault'); } catch (err) {} }
        if (e.name === 'OperationError') msg.textContent = '解鎖碼錯誤（請確認大小寫與符號完全相同）';
        else msg.textContent = '無法讀取特別版檔案：' + e.message;
      }
    }

          audio.volume = Math.max(0, Math.min(1, from + (to - from) * (i / steps)));
          if (i >= steps) { clearInterval(t); resolve(); }
        }, ms / steps);
      });
    }

      const snap = await sharedDb.ref('userPlays/' + currentUser.uid + '/' + y).once('value');
      const arr = Object.entries(snap.val() || {})
        .map(([id, n]) => ({ s: songs.find(x => x.id === Number(id)), n }))
        .filter(x => x.s).sort((a, b) => b.n - a.n);
      if (!arr.length) return showPanel(y + ' 年度回顧', '<p class="text-slate-500">今年還沒有播放紀錄</p>');
      const total = arr.reduce((a, b) => a + b.n, 0);
      const genreCount = {};
      arr.forEach(x => { genreCount[x.s.genre] = (genreCount[x.s.genre] || 0) + x.n; });
      const topGenre = Object.entries(genreCount).sort((a, b) => b[1] - a[1])[0];
      showPanel(y + ' 年度回顧', `
        <p class="mb-2">今年共播放 <b>${total}</b> 次，最常聽的分類是 <b>${esc(topGenre[0])}</b></p>
        <ol class="list-decimal pl-5 space-y-1">${arr.slice(0, 10).map(x => `<li>${esc(x.s.title)}（${x.n} 次）</li>`).join('')}</ol>`);
    });

    window.approveComment = function (cid) {
      if (!isAdminUser() || commentSongId === null) return;
      sharedDb.ref('comments/' + commentSongId + '/' + cid + '/approved').set(true);
    };

    document.getElementById('adminReportBtn').addEventListener('click', async () => {
      if (!isAdminUser() || !sharedDb) return alert('僅管理員可使用');
      const [daily, act] = await Promise.all([
        sharedDb.ref('daily').limitToLast(14).once('value'),
        sharedDb.ref('activity').once('value')
      ]);
      const d = daily.val() || {};
      const rows = Object.keys(d).sort().map(k => `
        <tr><td class="pr-3">${k}</td><td class="pr-3">${d[k].plays || 0}</td><td class="pr-3">${d[k].likes || 0}</td><td class="pr-3">${d[k].downloads || 0}</td><td>${d[k].comments || 0}</td></tr>`).join('');
      const today = todayKey();
      const flags = Object.entries(act.val() || {})
        .map(([uid, days]) => [uid, (days || {})[today] || 0])
        .filter(([u, n]) => n >= 30)
        .map(([u, n]) => `<li>帳號 ${esc(u.slice(0, 6))}… 今日操作 ${n} 次</li>`).join('');
      showPanel('管理員報表', `
        <h3 class="font-semibold mb-2">近 14 天數據</h3>
        <table class="text-xs"><tr><th class="pr-3 text-left">日期</th><th class="pr-3">播放</th><th class="pr-3">讚</th><th class="pr-3">下載</th><th>留言</th></tr>${rows}</table>
        <h3 class="font-semibold mt-4 mb-2">今日異常活動（操作 30 次以上）</h3>
        ${flags ? '<ul class="text-xs space-y-1">' + flags + '</ul>' : '<p class="text-slate-500 text-xs">沒有</p>'}`);
    });

    // ===== 啟動：先讀本機資料，再讀 music/songs.json（所有人共用的歌單） =====
    async function loadRemote() {
      try {
        const res = await fetch('music/songs.json');
        const all = await res.json();
        lockedMeta = all.filter(x => x.locked);
        const today = todayKey();
        const list = all.filter(x => !x.locked && (!x.publish_at || x.publish_at <= today) && (!x.hide_at || x.hide_at >= today));
        // 以 songs.json 為準：同 id 的舊資料（例如瀏覽器裡殘留的 wav 路徑）會被覆蓋
        list.forEach(s => {
          const i = songs.findIndex(x => x.id === s.id);
          if (i >= 0) songs[i] = { ...songs[i], ...s };
          else songs.push(s);
        });
        // 移除不在 songs.json 裡、但仍殘留在本機的舊歌曲
        const remoteIds = list.map(s => s.id);
        songs = songs.filter(s => remoteIds.includes(s.id));
        autoUnlockVault();
      } catch (e) { console.warn('無法讀取 songs.json', e); }
    }

    load();
    loadRemote().then(() => {
      songs.forEach(s => { if (!stats[s.id]) stats[s.id] = { plays: 0, likes: 0 }; });
      genres = [...new Set(songs.map(s => s.genre))];
      nextId = songs.reduce((m, s) => Math.max(m, Number(s.id) || 0), 0) + 1;
      refreshAll();
    });
  </script>
</body>
</html>
